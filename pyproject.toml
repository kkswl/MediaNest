[project]
name = "yingji-index"
version = "0.1.0"
description = "Read-only 115 share media index"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1", "cryptography>=44", "defusedxml>=0.7,<1",
  "guessit>=3.8,<4", "p115client==0.0.9.7.2", "psycopg[binary]>=3.2,<4"
]
[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates dependency declarations (not business operations) at definition time.
"app/main.py" = ["B008"]
# Plugin/task boundaries deliberately contain arbitrary third-party failures.
"app/adapters.py" = ["BLE001"]
"app/metadata.py" = ["BLE001", "F401", "I001"]
"app/worker.py" = ["BLE001", "I001"]
"app/metadata_parse.py" = ["F401", "I001"]
"app/inference.py" = ["I001"]
"app/tmdb_impl.py" = ["I001"]
"app/metadata_links.py" = ["I001"]
"app/identify_impl.py" = ["I001", "BLE001"]
"app/identify_fixed.py" = ["I001", "F401"]
"app/identify_fixed2.py" = ["I001"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
